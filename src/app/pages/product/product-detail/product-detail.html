<!-- product-detail.html -->
<section class="product" *ngIf="product; else noData">
  <!-- Back button -->
  <div class="back-btn">
    <button type="button" (click)="goBack()" aria-label="Quay lại danh sách sản phẩm">
      <<i class="fa-solid fa-door-open"></i>>
    </button>
  </div>

  <div class="meta">
    <h3>{{ product.brand }}</h3>
    <h1>{{ product.title }}</h1>

    <p class="price" aria-hidden="false">
      <span class="muted">Giá từ:</span>
      <strong>{{ formatPrice(product.price) }}</strong>
      <span class="muted">{{ product.currency }}</span>
    </p>

    <ul class="specs" aria-label="Thông số kỹ thuật">
      <li *ngFor="let s of product.specs">{{ s }}</li>
    </ul>
  </div>

  <div class="visual">
    <div class="car-wrap">
      <img
        #mainImgRef
        class="main-img"
        [src]="mainImg"
        [alt]="product.title"
        loading="lazy"
      />
    </div>

    <div class="colors" *ngIf="swatches?.length">
      <div class="label">Màu sắc:</div>

      <div class="swatches" role="list" aria-label="Chọn màu sắc">
        <button
          *ngFor="let s of swatches; let i = index"
          class="swatch"
          role="listitem"
          [class.active]="activeIndex === i"
          [attr.aria-current]="activeIndex === i ? 'true' : null"
          [style.background]="s.colorCss || '#ddd'"
          (click)="selectColor(i)"
          (keydown)="onSwatchKeydown($event, i)"
          [attr.aria-label]="'Chọn màu ' + (s.label || s.id)"
          type="button"
          tabindex="0"
        ></button>
      </div>
    </div>
  </div>

  <!-- TAB BUTTONS -->
  <div class="actions" role="tablist" aria-label="Tác vụ nhanh">
    <button
      class="action-item"
      role="tab"
      [attr.aria-selected]="isActive('intro') ? 'true' : 'false'"
      [class.active]="isActive('intro')"
      (click)="selectTab('intro')"
      type="button"
    >
      <div class="icon-round" aria-hidden="true">
        <img src="https://kiagovap-auto.com/wp-content/uploads/2021/03/affix-cover.png" alt="" loading="lazy"/>
      </div>
      <span>GIỚI THIỆU</span>
    </button>

    <button
      class="action-item"
      role="tab"
      [attr.aria-selected]="isActive('gallery') ? 'true' : 'false'"
      [class.active]="isActive('gallery')"
      (click)="selectTab('gallery')"
      type="button"
    >
      <div class="icon-round" aria-hidden="true">
        <img src="https://kiagovap-auto.com/wp-content/uploads/2021/03/affix-gallery.png" alt="" loading="lazy"/>
      </div>
      <span>HÌNH ẢNH</span>
    </button>

    <a class="action-item" role="link" href="#" (click)="$event.preventDefault()" aria-label="Tải catalog">
      <div class="icon-round" aria-hidden="true">
        <img src="https://kiagovap-auto.com/wp-content/uploads/2021/03/affix-catalog.png" alt="" loading="lazy"/>
      </div>
      <span>TẢI CATALOG</span>
    </a>
  </div>

  <!-- TAB CONTENT -->
  <div class="tab-content">
    <div *ngIf="activeTab === 'intro'" class="tab-pane intro" role="tabpanel" aria-labelledby="tab-intro">
      <h2>Giới thiệu</h2>
      <p class="intro-text">{{ product.title }} — biểu tượng của phong cách và tiện nghi.</p>

      <ul class="specs">
        <li *ngFor="let s of product.specs">{{ s }}</li>
      </ul>
    </div>

    <div *ngIf="activeTab === 'gallery'" class="tab-pane gallery" role="tabpanel" aria-labelledby="tab-gallery">
      <h2>Thư viện hình ảnh</h2>
      <div class="gallery-grid" aria-live="polite">
        <!-- dùng swatches làm gallery mẫu; đổi thành product.images nếu có -->
        <img
          *ngFor="let s of swatches"
          [src]="s.img"
          [alt]="s.label || s.id"
          loading="lazy"
        />
      </div>
    </div>
  </div>
</section>

<ng-template #noData>
  <div class="no-data" role="status">
    Không có dữ liệu sản phẩm để hiển thị.
  </div>
</ng-template>
