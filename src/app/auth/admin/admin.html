<div class="login-layout" role="main">
    <div class="visual-panel" aria-hidden="true">
        <div class="visual__overlay"></div>
        <div class="visual__content">
            <h1 class="visual__title">Dashboard Admin</h1>
            <p class="visual__subtitle">Chỉ dành cho quản trị viên. Mọi truy cập
                đều được giám sát.</p>
        </div>
    </div>

    <aside class="form-panel">
        <div class="form-panel__brand">
            <div class="brand__avatar">
                <img *ngIf="adminAvatarUrl; else defaultAvatar"
                    [src]="adminAvatarUrl" alt="Admin avatar" />
                <ng-template #defaultAvatar>{{ adminInitial }}</ng-template>
            </div>

            <div class="brand__avatar-actions">
                <input #fileInput type="file" accept="image/*"
                    (change)="onAvatarSelected($event)" hidden />
                <button type="button" (click)="fileInput.click()">Chọn
                    ảnh</button>
                <button *ngIf="adminAvatarUrl" type="button"
                    (click)="removeAvatar()">Xóa</button>

            </div>

            <div>
                <div class="brand__name">Tên Admin</div>
            </div>
        </div>

        <div class="card">
            <header class="card__header">
                <h2>Đăng nhập</h2>
                <p class="muted">Nhập thông tin để truy cập admin</p>
            </header>

            <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" novalidate
                class="card__form">
                <label class="field">
                    <span class="label">Tên đăng nhập</span>
                    <input type="text" formControlName="user"
                        placeholder="Nhập tên đăng nhập" autocomplete="username"
                        autocapitalize="off" aria-label="Tên đăng nhập" />
                    <small class="error"
                        *ngIf="user.invalid && (user.dirty || user.touched)">Tên
                        đăng nhập là bắt buộc.</small>
                </label>

                <label class="field">
                    <span class="label">Mật khẩu</span>
                    <div class="password-wrap">
                        <input [type]="showPassword ? 'text' : 'password'"
                            formControlName="password"
                            placeholder="Nhập mật khẩu"
                            autocomplete="current-password"
                            aria-label="Mật khẩu" />
                        <button
                            type="button"
                            class="toggle"
                            (click)="togglePassword()"
                            [attr.aria-pressed]="showPassword"
                            [attr.aria-label]="showPassword ? 'Ẩn mật khẩu' : 'Hiện mật khẩu'">

                            <!-- Eye icon (ẩn password) -->
                            <svg *ngIf="!showPassword"
                                xmlns="http://www.w3.org/2000/svg" width="22"
                                height="22"
                                viewBox="0 0 24 24" fill="none"
                                stroke="currentColor"
                                stroke-width="2" stroke-linecap="round"
                                stroke-linejoin="round">
                                <path
                                    d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z" />
                                <circle cx="12" cy="12" r="3" />
                            </svg>

                            <!-- Eye-off icon (hiện password) -->
                            <svg *ngIf="showPassword"
                                xmlns="http://www.w3.org/2000/svg" width="22"
                                height="22"
                                viewBox="0 0 24 24" fill="none"
                                stroke="currentColor"
                                stroke-width="2" stroke-linecap="round"
                                stroke-linejoin="round">
                                <path
                                    d="M17.94 17.94A10.94 10.94 0 0112 19c-7 0-11-7-11-7a17.05 17.05 0 013.09-3.93" />
                                <path d="M9.88 9.88a3 3 0 104.24 4.24" />
                                <path
                                    d="M12 5c7 0 11 7 11 7a16.89 16.89 0 01-4.22 4.88" />
                                <line x1="1" y1="1" x2="23" y2="23" />
                            </svg>
                        </button>

                    </div>
                    <small class="error"
                        *ngIf="password.invalid && (password.dirty || password.touched)">
                        <span *ngIf="password.errors?.['required']">Mật khẩu là
                            bắt buộc.</span>
                        <span *ngIf="password.errors?.['minlength']">Mật khẩu
                            phải có ít nhất 6 ký tự.</span>
                    </small>
                </label>

                <div class="card__row">
                    <label class="remember">
                        <input type="checkbox" formControlName="remember" />
                        <span>Ghi nhớ đăng nhập</span>
                    </label>
                    <a class="forgot" href="#/auth/forgot">Quên mật khẩu?</a>
                </div>

                <button type="submit" class="btn"
                    [disabled]="loginForm.invalid || loading">{{ loading ?
                    'Đang xử lý...' : 'Đăng nhập' }}</button>

                <div class="server-error" *ngIf="serverError" role="alert">{{
                    serverError }}</div>
            </form>

            <footer class="card__footer muted">Đề xuất: bật xác thực hai yếu tố
                (2FA) cho tài khoản quản trị.</footer>
        </div>
    </aside>
</div>
