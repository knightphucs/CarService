<div class="login-container">
  <div class="login-card">
    <div class="login-header">
      <div class="logo">
        <a routerLink="/">
          <span class="logo-main">SALE</span><span class="logo-accent">CAR</span>
        </a>
      </div>
    </div>

    <div class="login-fields">
      <div class="input-group">
        <label for="email1">Địa chỉ Email</label>
        <input id="email1" type="text" placeholder="Nhập địa chỉ email" />
      </div>

      <div class="input-group">
        <label for="password1">Mật khẩu</label>
        <input id="password1" type="password" placeholder="Nhập mật khẩu" />
      </div>

      <div class="options">
        <div class="remember">
          <p-checkbox id="rememberme1" [(ngModel)]="checked1" [binary]="true"></p-checkbox>
          <label for="rememberme1">Lưu đăng nhập</label>
        </div>
        <a href="/forgot-password">Quên mật khẩu?</a>
      </div>

      <div class="register-text">
        <p>
          Bạn chưa có tài khoản?
          <a href="/register">Đăng ký ngay!</a>
        </p>
      </div>
    </div>

    <button class="login-btn">
      <i class="pi pi-user"></i>
      <span>Đăng nhập</span>
    </button>
  </div>
</div>
